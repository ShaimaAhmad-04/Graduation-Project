<div class="login-page">
  <div class="login-wrapper">
    <div class="login-card">

      <div class="card-logo">
        <i class="bi bi-envelope" style="font-size:28px; color:white;"></i>
      </div>
      <p class="card-brand">InternPath</p>

      <h1 class="card-title">Forgot Password</h1>
      <p class="card-subtitle">
        Enter your email to receive a reset link
      </p>

      <div class="success-msg" *ngIf="successMessage">{{ successMessage }}</div>
      <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <input type="email" [(ngModel)]="email" placeholder="your.email@psut.edu.jo">
        </div>
      </div>

      <button class="btn-login" (click)="onForgotPassword()" [disabled]="isLoading">
        {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
      </button>

      <p class="signup-text">
        <a class="signup-link" (click)="goToLogin()">Back to Login</a>
      </p>

    </div>
  </div>
</div>
