<div class="container-fluid company-setup-wrapper">

    <div class="homepage-Body">

        <!-- HERO -->
        <div class="title">

            <div class="icon-container hero-icon-wrapper">
                <i class="bi bi-building hero-briefcase-icon"></i>
            </div>

            <h1 class="title-heading gradient-text">
                Complete Your Company Profile
            </h1>

            <p class="subtitle">
                Set up your company details to start posting internships
            </p>

        </div>

        <!-- FORM -->
        <div class="introduction">

            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-6">

                    <div class="row colored-background shadow-sm">

                        <form
                            [formGroup]="companyForm"
                            (ngSubmit)="saveCompany()"
                            class="w-100">

                            <!-- Company Name -->
                            <div class="mb-3">
                                <label class="form-label">Company Name *</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    formControlName="name"
                                    placeholder="Enter company name" />
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea
                                    class="form-control"
                                    formControlName="description"
                                    rows="3"
                                    placeholder="Describe your company">
                </textarea>
                            </div>

                            <!-- Industry -->
                            <div class="mb-3">
                                <label class="form-label">Industry</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    formControlName="industry"
                                    placeholder="e.g. Software, Finance" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Location *</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    formControlName="location"
                                    placeholder="e.g. Amman, Jordan" />
                            </div>

                            <!-- Website -->
                            <div class="mb-3">
                                <label class="form-label">Website</label>
                                <input
                                    type="url"
                                    class="form-control"
                                    formControlName="website"
                                    placeholder="https://yourcompany.com" />
                            </div>

                            <!-- BUTTONS -->
                            <div class="introduction-buttons mt-4 d-flex gap-3">

                                <!-- Cancel / Skip -->
                                <button
                                    type="button"
                                    class="btn btn-light w-50"
                                    (click)="skipSetup()">

                                    Skip for now
                                </button>

                                <button
                                    type="submit"
                                    class="btn btn-white-gradient btn-with-icon w-50"
                                    [disabled]="companyForm.invalid || isSubmitting">

                                    {{ isSubmitting ? 'Saving...' : 'Continue'
                                    }}

                                    <span class="arrow-icon"
                                        *ngIf="!isSubmitting">→</span>

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
